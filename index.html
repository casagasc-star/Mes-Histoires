<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Nouvelles - Histoires en bord de Dordogne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --font-body: 'Lora', serif;
            --font-heading: 'Montserrat', sans-serif;
            --color-primary: #8B4513;
            --color-secondary: #D2691E;
            --color-accent: #FF8C00;
            --color-bg-light: rgba(255, 251, 240, 0.9);
            --color-text: #333;
            --color-text-light: #555;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-body);
            background-color: #f4f4f4;
            color: var(--color-text);
            line-height: 1.6;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 245, 230, 0.5);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--color-bg-light);
            border-radius: 12px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--color-secondary);
            padding-bottom: 1rem;
        }

        header h1 {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: var(--color-primary);
            margin: 0;
        }

        header p {
            font-style: italic;
            color: var(--color-text-light);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-family: var(--font-heading);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
        }
        .btn-secondary:hover {
            background-color: var(--color-primary);
            color: white;
        }

        main h2 {
            font-family: var(--font-heading);
            color: var(--color-primary);
            text-align: center;
            margin-bottom: 2rem;
        }

        .stories-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
        }

        .story-card {
            flex: 0 0 auto;
            width: 320px;
            background: white;
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .story-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .story-card h3 {
            font-family: var(--font-heading);
            color: var(--color-primary);
            margin-top: 0;
            font-size: 1.4rem;
        }
        
        .story-card .author {
            font-size: 0.9rem;
            color: var(--color-text-light);
            font-style: italic;
            margin-bottom: 1rem;
        }
        
        .story-card .accroche {
            font-weight: bold;
            margin-bottom: 1rem;
        }
        
        .story-card .extrait {
            flex-grow: 1;
            margin-bottom: 1rem;
        }
        
        .story-card .card-footer {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .story-card .read-epub-btn {
            background: var(--color-secondary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-family: var(--font-heading);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .story-card .read-epub-btn:hover {
            background: var(--color-primary);
        }

        .story-images {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
        }
        
        .story-images img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .story-images img:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .empty-message {
            text-align: center;
            color: var(--color-text-light);
            font-style: italic;
            padding: 2rem;
        }

        #watermark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            opacity: 0.1;
            pointer-events: none;
            z-index: 500;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                margin: 1rem;
            }
            header h1 {
                font-size: 1.8rem;
            }
            .story-card {
                width: 100%;
            }
            .controls {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5rem;
            }
            .story-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div id="watermark"></div>
    
    <div class="container">
        <header>
            <h1>Mes Nouvelles</h1>
            <p>Des histoires inspirées par les berges de la Dordogne</p>
        </header>

        <div class="controls">
            <button id="increase-font-btn" class="btn btn-secondary">
                <i class="fas fa-plus"></i> Police +
            </button>
            <button id="decrease-font-btn" class="btn btn-secondary">
                <i class="fas fa-minus"></i> Police -
            </button>
        </div>

        <main>
            <h2>Les Histoires</h2>
            <div id="stories-display" class="stories-container">
                <!-- Les histoires sont définies dans le script ci-dessous -->
            </div>
        </main>
    </div>

    <script>
        // ========================================
        // CONFIGURATION DES HISTOIRES
        // ========================================
        // Pour ajouter une histoire, copiez le bloc entre { }, 
        // collez-le en dessous et modifiez les valeurs
        
        const stories = [
            {
                titre: "Exemple de Nouvelle",
                auteur: "Votre Nom",
                accroche: "Une courte phrase accrocheuse pour présenter l'histoire...",
                extrait: "Voici l'extrait de votre histoire. Vous pouvez écrire plusieurs paragraphes ici.\n\nUtilisez \\n\\n pour créer des sauts de paragraphe.",
                epub_url: "https://archive.org/download/votre-fichier/livre.epub",
                epub_download_url: "https://archive.org/download/votre-fichier/livre.epub",
                images: [
                    "https://archive.org/download/votre-fichier/image1.jpg",
                    "https://archive.org/download/votre-fichier/image2.jpg"
                ]
            },
            // Copiez le bloc ci-dessus et ajoutez vos histoires ici :
            // {
            //     titre: "Titre de votre 2e histoire",
            //     auteur: "Votre Nom",
            //     accroche: "Accroche...",
            //     extrait: "Extrait...",
            //     epub_url: "",
            //     epub_download_url: "",
            //     images: []
            // },
        ];

        // URL de l'image de fond (optionnel)
        const backgroundImage = "";
        // URL du filigrane (optionnel)
        const watermarkImage = "";

        // ========================================
        // CODE DE FONCTIONNEMENT (Ne pas modifier)
        // ========================================
        
        let currentFontSize = 1;
        const storiesDisplay = document.getElementById('stories-display');
        const increaseFontBtn = document.getElementById('increase-font-btn');
        const decreaseFontBtn = document.getElementById('decrease-font-btn');
        const watermark = document.getElementById('watermark');

        // Appliquer le fond et le filigrane
        if (backgroundImage) {
            document.body.style.backgroundImage = `url('${backgroundImage}')`;
        }
        if (watermarkImage) {
            watermark.style.backgroundImage = `url('${watermarkImage}')`;
        }

        // Afficher les histoires
        const renderStories = () => {
            if (stories.length === 0) {
                storiesDisplay.innerHTML = '<p class="empty-message">Aucune histoire pour le moment. Modifiez le fichier pour en ajouter !</p>';
                return;
            }

            storiesDisplay.innerHTML = '';
            
            stories.forEach(story => {
                const card = document.createElement('article');
                card.className = 'story-card';

                let epubButtonsHtml = '';
                if (story.epub_url) {
                    const downloadUrl = story.epub_download_url || story.epub_url;
                    epubButtonsHtml = `
                        <a href="${story.epub_url}" target="_blank" class="read-epub-btn">
                            <i class="fas fa-book-open"></i> Lire EPUB
                        </a>
                        <a href="${downloadUrl}" download class="read-epub-btn" style="background: var(--color-accent);">
                            <i class="fas fa-download"></i> Télécharger EPUB
                        </a>
                    `;
                } else {
                    epubButtonsHtml = `<span style="color: #999; font-size: 0.85rem;"><i class="fas fa-book"></i> Pas d'EPUB</span>`;
                }

                let imagesHtml = '';
                if (story.images && story.images.length > 0) {
                    imagesHtml = '<div class="story-images">';
                    story.images.forEach((imgUrl, idx) => {
                        imagesHtml += `
                            <img src="${imgUrl}" 
                                 alt="Image ${idx + 1}" 
                                 title="Cliquez pour agrandir"
                                 onclick="window.open('${imgUrl}', '_blank')">
                        `;
                    });
                    imagesHtml += '</div>';
                }

                card.innerHTML = `
                    <h3>${story.titre}</h3>
                    <p class="author">Par ${story.auteur}</p>
                    <p class="accroche">${story.accroche}</p>
                    <p class="extrait">${story.extrait.replace(/\n/g, '<br>')}</p>
                    ${imagesHtml}
                    <div class="card-footer">
                        ${epubButtonsHtml}
                    </div>
                `;
                storiesDisplay.appendChild(card);
            });
        };

        const updateFontSize = () => {
            const elements = document.querySelectorAll('.story-card p, .story-card h3');
            elements.forEach(el => {
                el.style.fontSize = `${currentFontSize}rem`;
            });
        };

        increaseFontBtn.addEventListener('click', () => {
            if (currentFontSize < 2) {
                currentFontSize += 0.2;
                updateFontSize();
            }
        });

        decreaseFontBtn.addEventListener('click', () => {
            if (currentFontSize > 0.8) {
                currentFontSize -= 0.2;
                updateFontSize();
            }
        });

        // Initialisation
        renderStories();
    </script>
</body>
</html>
